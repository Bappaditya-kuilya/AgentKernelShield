<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="centerPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="330" height="160" rx="18" fill="url(#bg)"/>
  <rect width="330" height="160" rx="18" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.2"/>

  <ellipse cx="85" cy="80" rx="58" ry="58" fill="url(#centerPulse)"/>

  <!-- Terminal window -->
  <rect x="22" y="34" width="126" height="92" rx="10" fill="url(#termGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)"/>
  <!-- title bar dots -->
  <circle cx="34" cy="46" r="3" fill="#f87171"/>
  <circle cx="44" cy="46" r="3" fill="#fbbf24"/>
  <circle cx="54" cy="46" r="3" fill="#34d399"/>
  <line x1="22" y1="54" x2="148" y2="54" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- prompt >_ -->
  <text x="34" y="82" font-family="monospace" font-size="22" font-weight="700" fill="#a5b4fc" filter="url(#glow)">&gt;_</text>
  <!-- kernel hook line -->
  <line x1="70" y1="78" x2="108" y2="78" stroke="#818cf8" stroke-width="1.6" stroke-dasharray="5 3" stroke-opacity="0.8"/>
  <circle cx="70" cy="78" r="3" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="108" cy="78" r="3" fill="#818cf8" filter="url(#glow)"/>

  <!-- hook nodes -->
  <circle cx="48" cy="104" r="2.5" fill="#6366f1"/>
  <circle cx="62" cy="108" r="2.5" fill="#6366f1" fill-opacity="0.7"/>
  <circle cx="76" cy="108" r="2.5" fill="#6366f1" fill-opacity="0.5"/>

  <!-- Lock badge -->
  <g filter="url(#glow)">
    <rect x="106" y="88" width="30" height="26" rx="6" fill="#0d1424" stroke="#a5b4fc" stroke-width="1.6"/>
    <path d="M112 88 v-4 a9 9 0 0 1 18 0 v4" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="121" cy="100" r="2.6" fill="#a5b4fc"/>
    <line x1="121" y1="102" x2="121" y2="107" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Divider -->
  <line x1="178" y1="28" x2="178" y2="132" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- aks text -->
  <text x="316" y="105" text-anchor="end" font-family="'Helvetica Neue', 'Arial', 'Liberation Sans', sans-serif" font-size="68" font-weight="800" fill="url(#wordGrad)" letter-spacing="2" filter="url(#textGlow)">aks</text>
</svg>
