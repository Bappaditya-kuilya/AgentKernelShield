<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #08090A; /* neutral */
      --surface:   #0F1011; /* surface */
      --border:    #ffffff14; /* border */
      --text:      #F7F8F8; /* on-surface */
      --muted:     #A2A7B2; /* muted */
      --red:       #FF5A5F; /* error */
      --green:     #2FB344; /* success */
      --accent:    #7170FF; /* primary */
      --warn:      #FFCC00; /* warning */
      --bad:       #FF5A5F; /* error */
      --mono:      'Berkeley Mono', ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
      font-family: -apple-system, 'Inter', 'Inter Variable', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    /* ── Header: single 32px signal line ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      font-size: 11px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
    }

    .logo-dot.offline { background: var(--muted); }

    .profile-badge,
    .version-badge {
      background: none;
      border: none;
      color: var(--muted);
      padding: 0;
      font-size: 11px;
    }

    .stats {
      margin-left: auto;
      display: flex;
      gap: 16px;
      align-items: baseline;
    }

    .stat {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 6px;
    }

    .stat-value {
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0;
    }

    .stat-value.total  { color: var(--text); }
    .stat-value.blocks { color: var(--red); }
    .stat-value.allows { color: var(--green); }

    .conn-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      padding: 0;
      border: none;
    }

    .conn-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .conn-dot.offline { background: var(--red); }

    /* ── Tab bar: text-only ── */
    .tab-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--muted);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 510;
      font-family: inherit;
      letter-spacing: 0;
      margin-bottom: -1px;
    }

    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* blocked tab button turns red when there are blocks */
    .tab-btn.has-blocks { border-bottom-color: var(--red); color: var(--red); }

    /* ── Tab content panels ── */
    .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-panel.active { display: flex; }
    .agent-task { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    .agent-task-label { color: var(--muted); font-size: 11px; }
    .agent-replay-badge { color: var(--warn); border: 1px solid currentColor; border-radius: 9999px; padding: 0 8px; font-size: 10px; }
    .agent-replaybar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); }
    .agent-replay-note { color: var(--muted); font-size: 11px; }
    .agent-timeline { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .tool-card { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 12px 16px 16px; cursor: pointer; }
    .tool-card-name { font-weight: 600; font-size: 13px; }
    .tool-card-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .tool-card-blocks { color: var(--bad); font-size: 12px; margin-top: 4px; }

    /* ── Toolbar: text-only filters ── */
    .toolbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
      font-size: 11px;
    }

    .filter-group { display: flex; gap: 2px; }

    .filter-btn {
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--muted);
      padding: 2px 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 510;
      font-family: inherit;
      letter-spacing: 0;
    }

    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .filter-btn.action-block.active { color: var(--red); border-bottom-color: var(--red); }
    .filter-btn.action-allow.active { color: var(--green); border-bottom-color: var(--green); }
    .filter-btn.type-file.active,
    .filter-btn.type-exec.active,
    .filter-btn.type-net.active,
    .filter-btn.type-ssl.active     { color: var(--text); border-bottom-color: var(--text); }

    .divider { width: 1px; background: var(--border); align-self: stretch; margin: 0 4px; }

    .clear-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      padding: 2px 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
    }
    .clear-btn:hover { color: var(--red); }

    /* ── Event table: dense signal lines ── */
    .table-container { flex: 1; overflow-y: auto; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }

    thead {
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
    }

    th {
      padding: 6px 10px;
      text-align: left;
      font-size: 11px;
      letter-spacing: 0;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-weight: 510;
    }

    th.col-time    { width: 70px; }
    th.col-pid     { width: 60px; }
    th.col-process { width: 120px; }
    th.col-type    { width: 70px; }
    th.col-detail  { }
    th.col-action  { width: 75px; text-align: right; }

    td {
      padding: 4px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    tr.row-block {
      border-left: 2px solid var(--red);
      cursor: pointer;
    }

    tr.row-allow { border-left: 2px solid transparent; cursor: pointer; }

    .time-cell    { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; font-family: var(--mono); }
    .pid-cell     { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; font-family: var(--mono); }
    .process-cell { color: var(--text); font-weight: 500; }

    .badge {
      display: inline;
      padding: 0;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .badge-file,
    .badge-exec,
    .badge-net,
    .badge-ssl  { background: none; color: var(--muted); }

    .detail-cell { color: var(--muted); font-size: 11px; font-family: var(--mono); }
    tr.row-block .detail-cell { color: var(--text); }
    .detail-cell .dest { color: inherit; }
    .detail-cell .ssl-preview { color: var(--muted); font-size: 11px; }
    .detail-cell .ssl-dir { color: var(--muted); margin-right: 6px; }

    .action-cell { text-align: right; }

    .action-block {
      display: inline;
      padding: 0;
      color: var(--red);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .action-allow {
      display: inline;
      padding: 0;
      color: var(--green);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* ── Empty state ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 20px;
      color: var(--muted);
      gap: 8px;
    }

    .empty-text { font-size: 11px; }

    /* ── Blocked tab: flat groups, no boxes ── */
    .blocked-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .blocked-proc {
      border: none;
      border-bottom: 1px solid var(--border);
    }

    .blocked-proc-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 0;
      cursor: pointer;
      user-select: none;
    }

    .blocked-proc-pid {
      background: none;
      border: none;
      color: var(--muted);
      padding: 0;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .blocked-proc-comm {
      color: var(--text);
      font-weight: 600;
      font-size: 12px;
    }

    .blocked-proc-ppid {
      color: var(--muted);
      font-size: 11px;
    }

    .blocked-proc-badge {
      margin-left: auto;
      background: none;
      color: var(--red);
      border: none;
      padding: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .blocked-events {
      border-top: none;
    }

    .blocked-event {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 4px 0 4px 16px;
      border-bottom: none;
      font-size: 11px;
    }

    .blocked-event-time { color: var(--muted); font-size: 11px; width: 60px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .blocked-event-detail { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .blocked-event-reason { color: var(--muted); font-size: 11px; flex-shrink: 0; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot" id="liveDot"></div>
    aks
  </div>
  <div class="profile-badge" id="profileBadge">loading…</div>
  <div class="version-badge" id="versionBadge"></div>
  <div class="stats">
    <div class="stat"><span class="stat-value total"  id="statTotal">0</span><span class="stat-label">total</span></div>
    <div class="stat"><span class="stat-value blocks" id="statBlocked">0</span><span class="stat-label">blocked</span></div>
    <div class="stat"><span class="stat-value allows" id="statAllowed">0</span><span class="stat-label">allowed</span></div>
  </div>
  <div class="conn-status">
    <div class="conn-dot" id="connDot"></div>
    <span id="connLabel">connecting</span>
  </div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="log">Log</button>
  <button class="tab-btn" data-tab="blocked" id="blockedTabBtn">Blocked</button>
  <button class="tab-btn" data-tab="agent">Agent</button>
</div>

<!-- ── LOG TAB ── -->
<div class="tab-panel active" id="panel-log">
  <div class="toolbar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="action" data-value="all">All</button>
      <button class="filter-btn action-block" data-filter="action" data-value="BLOCK">Block</button>
      <button class="filter-btn action-allow" data-filter="action" data-value="ALLOW">Allow</button>
    </div>
    <div class="divider"></div>
    <div class="filter-group">
      <button class="filter-btn type-file" data-filter="type" data-value="file_open">File</button>
      <button class="filter-btn type-exec" data-filter="type" data-value="exec">Exec</button>
      <button class="filter-btn type-net"  data-filter="type" data-value="net_connect">Net</button>
      <button class="filter-btn type-ssl"  data-filter="type" data-value="ssl_data">SSL</button>
    </div>
    <span id="pidFilterLabel" style="display:none; font-size:11px; color:var(--muted); margin-left:8px;"></span>
    <button id="clearPidFilter" style="display:none; font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer; padding:2px 6px;">✕ clear pid filter</button>
    <button class="clear-btn" id="clearBtn">clear</button>
  </div>

  <div class="table-container">
    <div class="empty" id="emptyState">
      <div class="empty-text">— idle · waiting for events —</div>
    </div>
    <table id="eventsTable" style="display:none">
      <thead>
        <tr>
          <th class="col-time">time</th>
          <th class="col-pid">pid</th>
          <th class="col-process">process</th>
          <th class="col-type">type</th>
          <th class="col-detail">detail</th>
          <th class="col-action">action</th>
        </tr>
      </thead>
      <tbody id="eventsBody"></tbody>
    </table>
  </div>
</div>

<!-- ── BLOCKED TAB ── -->
<div class="tab-panel" id="panel-blocked">
  <div class="empty" id="blockedEmpty">
    <div class="empty-text">— no blocks —</div>
  </div>
  <div class="blocked-container" id="blockedContainer" style="display:none"></div>
</div>

<!-- ── AGENT TAB ── -->
<div class="tab-panel" id="panel-agent">
  <div class="agent-task">
    <span class="agent-task-label">task</span>
    <span id="agentTaskText">— waiting for agent activity —</span>
    <span class="agent-replay-badge" id="agentReplayBadge" style="display:none">REPLAY</span>
  </div>
  <div class="agent-replaybar" id="agentReplayBar" style="display:none">
    <button class="filter-btn" id="replayPlay">pause</button>
    <button class="filter-btn" id="replayRestart">restart</button>
    <button class="filter-btn" id="replaySpeed">1×</button>
    <span class="agent-replay-note">scripted demo data, same render path as live</span>
  </div>
  <div class="empty" id="agentEmpty">
    <div class="empty-text">— no agent activity yet —</div>
  </div>
  <div class="agent-timeline" id="agentTimeline" style="display:none"></div>
</div>

<script>
  const MAX_ROWS = 500;

  const state = {
    processes:   new Map(), // pid → {pid, ppid, comm, blockedEvents:[]}
    agentProcs:  new Map(), // pid → {pid, ppid, comm, events:[]}
    agentMeta:   null,      // {task, agent, profile, tools:[{name,pids,fs}]}
    total:       0,
    blocked:     0,
    allowed:     0,
    filterAction: 'all',
    filterType:   null,
    filterPid:    null,
    activeTab:    'log',
  };

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const liveDot        = document.getElementById('liveDot');
  const profileBadge   = document.getElementById('profileBadge');
  const versionBadge   = document.getElementById('versionBadge');
  const connDot        = document.getElementById('connDot');
  const connLabel      = document.getElementById('connLabel');
  const statTotal      = document.getElementById('statTotal');
  const statBlocked    = document.getElementById('statBlocked');
  const statAllowed    = document.getElementById('statAllowed');
  const eventsTable    = document.getElementById('eventsTable');
  const eventsBody     = document.getElementById('eventsBody');
  const emptyState     = document.getElementById('emptyState');
  const clearBtn       = document.getElementById('clearBtn');
  const blockedTabBtn  = document.getElementById('blockedTabBtn');
  const blockedEmpty   = document.getElementById('blockedEmpty');
  const blockedContainer = document.getElementById('blockedContainer');
  const pidFilterLabel = document.getElementById('pidFilterLabel');
  const clearPidFilter = document.getElementById('clearPidFilter');

  // ── Helpers ────────────────────────────────────────────────────────────────
  function absTime(isoStr) {
    const d = new Date(isoStr);
    return d.toTimeString().slice(0, 8);
  }

  function relTime(isoStr) {
    const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
    if (diff < 5)    return 'just now';
    if (diff < 60)   return diff + 's';
    if (diff < 3600) return Math.floor(diff / 60) + 'm';
    return Math.floor(diff / 3600) + 'h';
  }

  setInterval(() => {
    document.querySelectorAll('[data-ts]').forEach(el => {
      el.textContent = absTime(el.dataset.ts);
      el.title = relTime(el.dataset.ts) + ' ago';
    });
  }, 30000);

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function typeBadge(evt) {
    const map = {
      file_open:   ['File', 'badge-file'],
      exec:        ['Exec', 'badge-exec'],
      net_connect: ['Net',  'badge-net'],
      ssl_data:    ['SSL',  'badge-ssl'],
    };
    const [label, cls] = map[evt.event] || [escHtml(evt.event), ''];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function detail(evt) {
    if (evt.event === 'net_connect') {
      return `<span class="dest">${escHtml(evt.dest_ip || '')}:${escHtml(String(evt.dest_port || ''))}</span>`;
    }
    if (evt.event === 'ssl_data') {
      const dir     = evt.ssl_dir || '';
      const preview = (evt.ssl_data || '').slice(0, 120);
      return `<span class="ssl-dir">[${escHtml(dir)}]</span><span class="ssl-preview">${escHtml(preview)}</span>`;
    }
    return escHtml(evt.path || '');
  }

  function eventDetail(evt) {
    if (evt.event === 'net_connect') return (evt.dest_ip || '') + ':' + (evt.dest_port || '');
    if (evt.event === 'ssl_data')    return '[' + (evt.ssl_dir || '') + '] ' + (evt.ssl_data || '').slice(0, 100);
    return evt.path || '';
  }

  // ── Log tab ────────────────────────────────────────────────────────────────
  function makeRow(evt) {
    const isBlock = evt.action === 'BLOCK';
    const tr = document.createElement('tr');
    tr.className = isBlock ? 'row-block' : 'row-allow';
    tr.dataset.action = evt.action;
    tr.dataset.event  = evt.event;
    tr.dataset.pid    = evt.pid;
    tr.title = evt.reason || '';

    tr.innerHTML = `
      <td class="time-cell" data-ts="${escHtml(evt.ts)}" title="${escHtml(evt.ts)}">${absTime(evt.ts)}</td>
      <td class="pid-cell">${escHtml(String(evt.pid))}</td>
      <td class="process-cell">${escHtml(evt.comm)}</td>
      <td>${typeBadge(evt)}</td>
      <td class="detail-cell">${detail(evt)}</td>
      <td class="action-cell">
        ${isBlock
          ? `<span class="action-block">■ Block</span>`
          : `<span class="action-allow">Allow</span>`}
      </td>`;

    // Click: if blocked, jump to Blocked tab for this PID;
    // otherwise filter log to this PID
    tr.addEventListener('click', () => {
      if (isBlock && state.processes.has(evt.pid) && state.processes.get(evt.pid).blockedEvents.length > 0) {
        switchTab('blocked');
        // scroll to card
        requestAnimationFrame(() => {
          const card = document.getElementById('bproc-' + evt.pid);
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      } else {
        setPidFilter(evt.pid, evt.comm);
      }
    });

    return tr;
  }

  function rowVisible(tr) {
    if (state.filterAction !== 'all' && tr.dataset.action !== state.filterAction) return false;
    if (state.filterType && tr.dataset.event !== state.filterType) return false;
    if (state.filterPid !== null && Number(tr.dataset.pid) !== state.filterPid) return false;
    return true;
  }

  function applyFilters() {
    let visible = 0;
    eventsBody.querySelectorAll('tr').forEach(tr => {
      const show = rowVisible(tr);
      tr.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    emptyState.style.display  = visible === 0 ? 'flex' : 'none';
    eventsTable.style.display = visible === 0 ? 'none' : '';
  }

  function setPidFilter(pid, comm) {
    state.filterPid = pid;
    pidFilterLabel.textContent = 'pid ' + pid + ' (' + comm + ')';
    pidFilterLabel.style.display = 'inline';
    clearPidFilter.style.display = 'inline';
    applyFilters();
    switchTab('log');
  }

  clearPidFilter.addEventListener('click', () => {
    state.filterPid = null;
    pidFilterLabel.style.display = 'none';
    clearPidFilter.style.display = 'none';
    applyFilters();
  });

  // ── Blocked tab ────────────────────────────────────────────────────────────
  function renderBlocked() {
    const blockedProcs = [...state.processes.values()]
      .filter(p => p.blockedEvents.length > 0)
      .sort((a, b) => {
        const at = new Date(a.blockedEvents[0].ts).getTime();
        const bt = new Date(b.blockedEvents[0].ts).getTime();
        return bt - at; // most recent first
      });

    if (blockedProcs.length === 0) {
      blockedEmpty.style.display    = 'flex';
      blockedContainer.style.display = 'none';
      return;
    }

    blockedEmpty.style.display    = 'none';
    blockedContainer.style.display = 'flex';

    // Update or create cards (avoid full re-render)
    blockedProcs.forEach(proc => {
      let card = document.getElementById('bproc-' + proc.pid);
      if (!card) {
        card = document.createElement('div');
        card.className = 'blocked-proc';
        card.id = 'bproc-' + proc.pid;
        blockedContainer.prepend(card);
      }

      // Parent info
      let ppidStr = '';
      if (proc.ppid) {
        const parent = state.processes.get(proc.ppid);
        ppidStr = parent
          ? `← <span class="blocked-proc-ppid">${proc.ppid} (${escHtml(parent.comm)})</span>`
          : `← <span class="blocked-proc-ppid">${proc.ppid}</span>`;
      }

      card.innerHTML = `
        <div class="blocked-proc-header" data-pid="${proc.pid}">
          <span class="blocked-proc-pid">${proc.pid}</span>
          <span class="blocked-proc-comm">${escHtml(proc.comm)}</span>
          ${ppidStr}
          <span class="blocked-proc-badge">${proc.blockedEvents.length} Blocked</span>
        </div>
        <div class="blocked-events">
          ${proc.blockedEvents.map(evt => `
            <div class="blocked-event">
              <span class="blocked-event-time" data-ts="${escHtml(evt.ts)}" title="${escHtml(evt.ts)}">${absTime(evt.ts)}</span>
              ${typeBadge(evt)}
              <span class="blocked-event-detail">${escHtml(eventDetail(evt))}</span>
              <span class="blocked-event-reason">${escHtml(evt.reason || '')}</span>
            </div>
          `).join('')}
        </div>`;

      // Click header → filter log to this PID
      card.querySelector('.blocked-proc-header').addEventListener('click', () => {
        setPidFilter(proc.pid, proc.comm);
      });
    });

    // Remove cards for PIDs that no longer exist (e.g. after clear)
    blockedContainer.querySelectorAll('.blocked-proc').forEach(card => {
      const pid = Number(card.id.replace('bproc-', ''));
      if (!state.processes.has(pid) || state.processes.get(pid).blockedEvents.length === 0) {
        card.remove();
      }
    });
  }

  // ── Add event ──────────────────────────────────────────────────────────────
  function addEvent(evt) {
    state.total++;
    if (evt.action === 'BLOCK') state.blocked++; else state.allowed++;
    statTotal.textContent   = state.total;
    statBlocked.textContent = state.blocked;
    statAllowed.textContent = state.allowed;

    // Update process map
    const pid = evt.pid;
    ingestAgent(evt);
    if (!state.processes.has(pid)) {
      state.processes.set(pid, { pid, ppid: evt.ppid || 0, comm: evt.comm, blockedEvents: [] });
    }
    const proc = state.processes.get(pid);
    if (evt.action === 'BLOCK') {
      proc.blockedEvents.unshift(evt);

      // Flash the Blocked tab button
      blockedTabBtn.classList.add('has-blocks');

      // If Blocked tab is active, update it
      if (state.activeTab === 'blocked') {
        renderBlocked();
      }
    }

    // Log tab: insert row
    const tr = makeRow(evt);
    eventsBody.insertBefore(tr, eventsBody.firstChild);
    while (eventsBody.children.length > MAX_ROWS) {
      eventsBody.removeChild(eventsBody.lastChild);
    }
    if (rowVisible(tr)) {
      emptyState.style.display  = 'none';
      eventsTable.style.display = '';
    } else {
      tr.style.display = 'none';
    }
  }

  // ── Agent tab: how the agent works ───────────────────────────────────────
  // Same events as Log/Blocked, grouped by process tree. Tool names come
  // from replay metadata when present; live mode labels each top-level
  // child subtree as one tool execution.
  function ingestAgent(evt) {
    if (!state.agentProcs.has(evt.pid)) {
      state.agentProcs.set(evt.pid, { pid: evt.pid, ppid: evt.ppid || 0, comm: evt.comm, events: [] });
    }
    state.agentProcs.get(evt.pid).events.push(evt);
    if (state.activeTab === 'agent') renderAgent();
  }

  function agentRoot() {
    for (const p of state.agentProcs.values()) {
      if (!p.ppid || !state.agentProcs.has(p.ppid)) return p;
    }
    return state.agentProcs.values().next().value || null;
  }

  function toolNameFor(pid, idx) {
    const tools = (state.agentMeta && state.agentMeta.tools) || [];
    const hit = tools.find(t => (t.pids || []).includes(pid));
    if (hit) return `${hit.name} · ${hit.fs || ''}`.trim();
    return `tool ${idx}`;
  }

  function renderAgent() {
    const box = document.getElementById('agentTimeline');
    const empty = document.getElementById('agentEmpty');
    const taskText = document.getElementById('agentTaskText');
    const root = agentRoot();
    if (!root) {
      empty.style.display = 'flex';
      box.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    box.style.display = 'flex';
    taskText.textContent = state.agentMeta && state.agentMeta.task
      ? `${state.agentMeta.task} — ${state.agentMeta.agent || ''} (${state.agentMeta.profile || ''})`.trim()
      : `${root.comm} tree · live`;

    const kids = [...state.agentProcs.values()]
      .filter(p => p.pid !== root.pid)
      .sort((a, b) => new Date(a.events[0].ts) - new Date(b.events[0].ts));
    // Every non-root process gets a card (children and grandchildren alike),
    // so nested tool-spawned processes (curl, sh) never vanish. Tool names
    // come from replay metadata when the pid matches, else tool N.
    const groups = kids;
    box.innerHTML = '';
    // Root card: the agent process itself
    box.appendChild(agentCard('agent · ' + root.comm, root));
    groups.forEach((p, i) => box.appendChild(agentCard(toolNameFor(p.pid, i + 1), p)));
  }

  function agentCard(name, proc) {
    const evts = proc.events;
    const blocks = evts.filter(e => e.action === 'BLOCK');
    const first = evts[0], last = evts[evts.length - 1];
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.innerHTML = `
      <div class="tool-card-name">${escHtml(name)} <span class="tool-card-sub">${proc.pid} (${escHtml(proc.comm)})</span></div>
      <div class="tool-card-sub">${evts.length} events · ${evts.length - blocks.length} allow · ${blocks.length} block · ${escHtml(String(first.ts))} → ${escHtml(String(last.ts))}</div>
      ${blocks.map(e => `<div class="tool-card-blocks">■ ${escHtml(eventDetail(e))} — ${escHtml(e.reason || '')}</div>`).join('')}`;
    card.addEventListener('click', () => setPidFilter(proc.pid, proc.comm));
    return card;
  }

  // ── Replay mode (?demo=1): scripted Gemini session through addEvent ───────
  const replay = { data: null, idx: 0, timer: null, speed: 1, playing: false };
  const REPLAY_STEP_MS = 900;

  function resetAll() {
    eventsBody.innerHTML = '';
    blockedContainer.innerHTML = '';
    state.processes.clear();
    state.agentProcs.clear();
    state.total = state.blocked = state.allowed = 0;
    statTotal.textContent = statBlocked.textContent = statAllowed.textContent = 0;
    emptyState.style.display    = 'flex';
    eventsTable.style.display   = 'none';
    blockedEmpty.style.display    = 'flex';
    blockedContainer.style.display = 'none';
    blockedTabBtn.classList.remove('has-blocks');
    state.filterPid = null;
    pidFilterLabel.style.display = 'none';
    clearPidFilter.style.display = 'none';
    document.getElementById('agentEmpty').style.display = 'flex';
    document.getElementById('agentTimeline').style.display = 'none';
    document.getElementById('agentTimeline').innerHTML = '';
  }

  function replayTick() {
    if (!replay.playing || !replay.data) return;
    if (replay.idx >= replay.data.events.length) {
      replay.playing = false;
      document.getElementById('replayPlay').textContent = 'play';
      return;
    }
    addEvent(replay.data.events[replay.idx++]);
    if (state.activeTab === 'agent') renderAgent();
    replay.timer = setTimeout(replayTick, REPLAY_STEP_MS / replay.speed);
  }

  function replaySetPlaying(on) {
    replay.playing = on;
    document.getElementById('replayPlay').textContent = on ? 'pause' : 'play';
    clearTimeout(replay.timer);
    if (on) replayTick();
  }

  async function bootReplay() {
    try {
      const base = new URL('.', window.location.href).href;
      const r = await fetch(new URL('demo-session.json', base).href);
      replay.data = await r.json();
    } catch (_) { return; }
    if (!replay.data || !Array.isArray(replay.data.events)) return;
    state.agentMeta = replay.data.meta || null;
    document.getElementById('agentReplayBar').style.display = 'flex';
    document.getElementById('agentReplayBadge').style.display = 'inline';
    resetAll();
    state.agentMeta = replay.data.meta || null;
    replay.idx = 0;
    switchTab('agent');
    replaySetPlaying(true);
  }

  document.getElementById('replayPlay').addEventListener('click', () => replaySetPlaying(!replay.playing));
  document.getElementById('replayRestart').addEventListener('click', () => {
    resetAll();
    state.agentMeta = (replay.data && replay.data.meta) || null;
    replay.idx = 0;
    replaySetPlaying(true);
  });
  document.getElementById('replaySpeed').addEventListener('click', (e) => {
    replay.speed = replay.speed >= 4 ? 1 : replay.speed * 2;
    e.target.textContent = replay.speed + '×';
  });

  // ── Tab switching ──────────────────────────────────────────────────────────
  function switchTab(tab) {
    state.activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    if (tab === 'blocked') renderBlocked();
    if (tab === 'agent') renderAgent();
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // ── Log filters ────────────────────────────────────────────────────────────
  document.querySelectorAll('[data-filter="action"]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-filter="action"]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.filterAction = btn.dataset.value;
      applyFilters();
    });
  });

  document.querySelectorAll('[data-filter="type"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.value;
      if (state.filterType === val) {
        btn.classList.remove('active');
        state.filterType = null;
      } else {
        document.querySelectorAll('[data-filter="type"]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.filterType = val;
      }
      applyFilters();
    });
  });

  clearBtn.addEventListener('click', () => {
    replaySetPlaying(false);
    replay.idx = 0;
    resetAll();
  });

  // ── SSE connection ─────────────────────────────────────────────────────────
  function connect() {
    const base = new URL('.', window.location.href).href;
    const src  = new EventSource(new URL('events', base).href);

    src.addEventListener('connected', () => {
      connDot.classList.remove('offline');
      connLabel.textContent = 'live';
      liveDot.classList.remove('offline');
    });

    src.onmessage = e => {
      try { addEvent(JSON.parse(e.data)); } catch (_) {}
    };

    src.onerror = () => {
      connDot.classList.add('offline');
      connLabel.textContent = 'reconnecting';
      liveDot.classList.add('offline');
    };
  }

  async function loadStatus() {
    try {
      const base = new URL('.', window.location.href).href;
      const r = await fetch(new URL('api/status', base).href);
      const d = await r.json();
      profileBadge.textContent = d.profile || 'unknown';
      if (d.version) versionBadge.textContent = d.version;
    } catch (_) {
      profileBadge.textContent = 'unknown';
    }
  }

  loadStatus();
  connect();
  if (new URLSearchParams(window.location.search).has('demo')) bootReplay();
</script>
</body>
</html>
